name: Security - Secret Scanning (detect-secrets)

on:
  push:
  pull_request:
  schedule:
    # Run every day at 02:00 UTC as a third layer alongside Gitleaks and TruffleHog
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Scan for secrets (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run detect-secrets
        # Scans only git-tracked files against the committed baseline.
        # Exits non-zero if any new secrets are introduced.
        run: |
          pip install detect-secrets
          git ls-files -z | xargs -0 detect-secrets scan --baseline .secrets.baseline
