name: Security - Secret Scanning (TruffleHog)

on:
  push:
  pull_request:
  schedule:
    # Run every day at 02:00 UTC as a second layer alongside Gitleaks
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for secrets (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Fetch full history so TruffleHog can scan all commits
          fetch-depth: 0

      - name: TruffleHog OSS (full git history)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ${{ github.workspace }}
          base: ""
          head: ""
          extra_args: --results=verified,unknown
